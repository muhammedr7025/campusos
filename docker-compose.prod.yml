# The deployed stack (server path /opt/apps/project4). It used to exist only
# on the server, where a `git reset --hard` during a deploy could wipe it, so
# it lives here instead. Secrets come from a .env beside this file:
# POSTGRES_PASSWORD and AUTH_SECRET.
#
#   docker compose -f docker-compose.prod.yml up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: campusos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: campusos_prod
    volumes:
      - campusos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campusos -d campusos_prod"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_ROOT_DOMAIN: campusos.muhammedr.me
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://campusos:${POSTGRES_PASSWORD}@db:5432/campusos_prod?sslmode=disable
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_TRUST_HOST: "true"
      NEXT_PUBLIC_ROOT_DOMAIN: campusos.muhammedr.me
      STORAGE_LOCAL_DIR: /app/storage
    # Uploads are written at runtime, so they have to outlive the image:
    # without this volume every rebuild takes the KYC documents, assignment
    # submissions and note PDFs with it.
    volumes:
      - campusos_uploads:/app/storage
    ports:
      - "127.0.0.1:3401:3000"

volumes:
  campusos_pgdata:
  campusos_uploads:
